services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: gmail_sender
      POSTGRES_USER: gmail_sender_user
      POSTGRES_PASSWORD: changeme123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: